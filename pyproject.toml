[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veriloop"
version = "0.1.0"
description = "Self-hosted AI testing agents that turn specs into validated Playwright tests"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["playwright", "test-automation", "ai", "self-healing", "natural-language", "testing", "llm", "fastapi", "load-testing", "security-testing"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "claude-agent-sdk==0.2.174",
    "mcp>=1.23.0,<2",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.1",
    "black==25.12.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=7.0.0",
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "sqlmodel==0.0.31",
    "psycopg2-binary==2.9.11",
    "alembic==1.18.3",
    "minio>=7.2.0",
    "networkx>=3.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0,<5.0.0",
    "redis>=4.0.0",
]

[project.scripts]
veriloop = "orchestrator.cli:main"
playwright-agent = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrator*"]
